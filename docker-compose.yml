version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hiresense_app
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://hiresense_user:hiresense_password@postgres:5432/hiresense_db
      - JWT_SECRET_KEY=hiresense_super_secure_jwt_production_secret_key_2026
      - JWT_ALGORITHM=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - UPLOAD_DIR=uploads
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads_data:/app/uploads

  postgres:
    image: postgres:15-alpine
    container_name: hiresense_postgres
    restart: always
    environment:
      POSTGRES_USER: hiresense_user
      POSTGRES_PASSWORD: hiresense_password
      POSTGRES_DB: hiresense_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hiresense_user -d hiresense_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  uploads_data:
